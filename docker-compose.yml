version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: karatsetu-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -lc "npm run db:migrate && npm run dev"
    networks:
      - proxy

networks:
  proxy:
    external: true