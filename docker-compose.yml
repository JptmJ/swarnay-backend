version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # The reverse proxy on the `proxy` network reaches the API by this name.
    container_name: karatsetu-backend
    restart: unless-stopped
    # DATABASE_URL, JWT_SECRET, CORS_ORIGINS… — the server's own .env
    # (copy .env.example and fill it in). It is read at run time, never built
    # into the image.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
    networks:
      - proxy

networks:
  proxy:
    external: true
